[project]
name = "benchlab"
version = "1.0.0"
description = "Single tool for benchmarking vLLM serving configs on the cluster: single runs, OFAT sweeps and grid searches"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
benchlab = "benchlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchlab"]
