apiVersion: v1
data:
  BLOCK_SIZE: '16'
  EXTRA_ARGS: --trust-remote-code --enable-prefix-caching --enable-chunked-prefill
    --enable-prompt-tokens-details --enable-auto-tool-choice --tool-call-parser=qwen3_coder
  GPU_MEMORY_UTILIZATION: '0.9'
  HF_HOME: /models/huggingface
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  KV_CACHE_DTYPE: fp8_e4m3
  MAX_MODEL_LEN: '262144'
  MAX_NUM_BATCHED_TOKENS: '2048'
  MAX_NUM_SEQS: '128'
  MODEL_NAME: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
  PORT: '8000'
  SERVED_MODEL_NAME: nemotron-3-super-120b
  TENSOR_PARALLEL_SIZE: '1'
  VLLM_ATTENTION_BACKEND: ''
kind: ConfigMap
metadata:
  labels:
    app: vllm
    sweep-tag: kv-cache-dtype-fp8-e4m3
  name: vllm-params
  namespace: vllm-inf
