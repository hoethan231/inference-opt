# =============================================================================
# Benchmark Job: RATE test (Poisson 20 req/s, coding-agent workload).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-rate-__TAG__
  namespace: vllm-inf
  labels:
    app: guidellm
    bench.suite: vllm
    bench.test: rate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 604800   # keep the Job object 7 days for inspection
  template:
    metadata:
      labels:
        app: guidellm
        bench.suite: vllm
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: guidellm
          image: ghcr.io/vllm-project/guidellm:v0.7.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-params
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              SVC="http://vllm-svc.vllm-inf.svc.cluster.local:8000"
              sed "s#http://localhost:8000#${SVC}#" /scenarios/coding-agent-rate.json > /tmp/scenario.json
              echo "Running GuideLLM RATE test against ${SVC}"
              exec guidellm run \
                --scenario /tmp/scenario.json \
                --tokenizer "{\"kind\":\"huggingface_auto\",\"model\":\"${MODEL_NAME}\",\"load_kwargs\":{\"trust_remote_code\":true}}" \
                --output kind=console \
                --output kind=json,path=/app/results/vllm-rate-__TAG__.json \
                --output kind=html,path=/app/results/vllm-rate-__TAG__.html
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 16Gi
          volumeMounts:
            - name: results
              mountPath: /app/results
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: vllm-sweep-results-pvc
        - name: scenarios
          configMap:
            name: coding-agent-scenarios
