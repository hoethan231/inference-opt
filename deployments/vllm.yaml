# =============================================================================
# vLLM benchmarking server (Deployment) + in-cluster Service.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm-inf
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-params
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          command: ["/bin/sh", "-c"]
          args:
            - >
              exec python3 -m vllm.entrypoints.openai.api_server
              --model "$MODEL_NAME"
              --served-model-name "$SERVED_MODEL_NAME"
              --host 0.0.0.0
              --port "$PORT"
              --tensor-parallel-size "$TENSOR_PARALLEL_SIZE"
              --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION"
              --max-model-len "$MAX_MODEL_LEN"
              --kv-cache-dtype "$KV_CACHE_DTYPE"
              --max-num-seqs "$MAX_NUM_SEQS"
              --max-num-batched-tokens "$MAX_NUM_BATCHED_TOKENS"
              --block-size "$BLOCK_SIZE"
              $EXTRA_ARGS
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 40Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 40Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: nemotron-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  namespace: vllm-inf
  labels:
    app: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
