# =============================================================================
# NVIDIA Nemotron 3 Super 120B (NVFP4).
#
# A model file owns everything model-specific: identity, which cache volume its
# weights live on, the parser flags its chat template needs, and sane defaults
# for knobs whose ceiling is model-dependent (context length above all). Point
# an experiment at `model: nemotron-3-super-120b` and none of this has to be
# repeated — it used to be copy-pasted into every custom ConfigMap and smuggled
# through a grid config's `base_overrides`.
# =============================================================================

# Short handle, also used as --served-model-name and in run tags/plots.
name: nemotron-3-super-120b

hf_repo: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4

# ReadWriteOnce volume holding the weights. `bench run` probes it and
# pre-seeds the download if this model isn't there yet.
cache_pvc: nemotron-model-cache

# vLLM image to serve this model with. Omit to use the cluster default.
image: vllm/vllm-openai:v0.26.0

# ConfigMap keys: model-specific defaults, overridable per experiment.
params:
  PORT: "8000"
  HF_HOME: /models/huggingface
  HF_XET_HIGH_PERFORMANCE: "1"

  MAX_MODEL_LEN: "262144"
  KV_CACHE_DTYPE: "fp8"
  MAX_NUM_SEQS: "128"
  MAX_NUM_BATCHED_TOKENS: "2048"
  GPU_MEMORY_UTILIZATION: "0.9"
  VLLM_ATTENTION_BACKEND: ""
  # BLOCK_SIZE: "16"
  
  TENSOR_PARALLEL_SIZE: "1"
  PIPELINE_PARALLEL_SIZE: "1"
  DATA_PARALLEL_SIZE: "1"
  EXPERT_PARALLEL: "0"

extra_args:
  - --trust-remote-code
  - --enable-prefix-caching
  - --enable-chunked-prefill
  - --enable-prompt-tokens-details
  - --enable-auto-tool-choice
  - --reasoning-parser=nemotron_v3
  - --tool-call-parser=qwen3_xml

# Native Multi-Token Prediction head, referenced by the spec-decode experiment
# as {spec_decode_method}. No draft model required.
