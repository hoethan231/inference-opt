# =============================================================================
# Poolside Laguna S 2.1 (NVFP4).
#
# Everything here used to live in `base_overrides` inside config/laguna-grid.json,
# which meant the model was invisible to the results index and the plots — you
# had to read MODEL_NAME back out of a manifest's overrides to know what a run
# had actually measured.
# =============================================================================

name: laguna-s-2.1

hf_repo: poolside/Laguna-S-2.1-NVFP4

# Shares the Nemotron cache volume: one RWO PVC on the single GPU node.
cache_pvc: nemotron-model-cache

image: vllm/vllm-openai:v0.26.0

params:
  MAX_MODEL_LEN: "131072"

  # Cache FlashInfer's JIT kernels on the model volume so they survive pod
  # restarts instead of being rebuilt on every deploy.
  FLASHINFER_WORKSPACE_BASE: /models/flashinfer
  MAX_JOBS: "4"

  # hf_transfer trips over this repo's Xet-backed files; the Xet fast path
  # works and is faster anyway.
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  HF_XET_HIGH_PERFORMANCE: "1"

  GPU_MEMORY_UTILIZATION: "0.9"

  TENSOR_PARALLEL_SIZE: "2"

  VLLM_ATTENTION_BACKEND: TRITON_ATTN


extra_args:
  - --trust-remote-code
  - --enable-prefix-caching
  - --enable-chunked-prefill
  - --enable-prompt-tokens-details
  - --enable-auto-tool-choice
  - --tool-call-parser=poolside_v1
  - --reasoning-parser=poolside_v1
  - --disable-custom-all-reduce
  - --attention-backend=TRITON_ATTN
  # - --enforce-eager
