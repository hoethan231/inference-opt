# =============================================================================
# vLLM benchmarking server (Deployment) + in-cluster Service.
#
# Reads every flag from the `vllm-params` ConfigMap, so re-tuning never touches
# this file: `./bench` renders a fresh ConfigMap per run and restarts the pod.
# The double-underscore names below are substituted from cluster/cluster.yaml and
# the model registry; run `bench render <experiment>` to see the result.
#
# strategy: Recreate — the outgoing pod holds the GPUs the incoming one needs, so
# a rolling update would deadlock: the new pod waits for devices the old pod only
# releases once the new pod is Ready.
#
# The GPU request is __GPU_COUNT__, rendered from the config's own
# TENSOR/PIPELINE/DATA_PARALLEL_SIZE (benchlab/parallelism.py). Do not put a
# literal back: a pod given fewer GPUs than its parallelism asks for hangs on a
# rank that never starts rather than failing.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: __DEPLOYMENT__
  namespace: __NAMESPACE__
  labels:
    app: __APP_LABEL__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: __APP_LABEL__
  template:
    metadata:
      labels:
        app: __APP_LABEL__
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: __VLLM_IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: __PARAMS_CONFIGMAP__
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: __HF_SECRET__
                  key: HF_TOKEN
          command: ["/bin/sh", "-c"]
          args:
            # `eval set --` splits EXTRA_ARGS into arguments while respecting
            # quotes, so a flag whose value contains spaces (e.g.
            # --speculative-config='{"method": "x"}') survives intact. Plain
            # unquoted $EXTRA_ARGS used to word-split such values into garbage.
            - >
              eval "set -- $EXTRA_ARGS" &&
              exec python3 -m vllm.entrypoints.openai.api_server
              --model "$MODEL_NAME"
              --served-model-name "$SERVED_MODEL_NAME"
              --host 0.0.0.0
              --port "$PORT"
              --tensor-parallel-size "$TENSOR_PARALLEL_SIZE"
              --pipeline-parallel-size "$PIPELINE_PARALLEL_SIZE"
              --data-parallel-size "$DATA_PARALLEL_SIZE"
              --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION"
              --max-model-len "$MAX_MODEL_LEN"
              --kv-cache-dtype "$KV_CACHE_DTYPE"
              --max-num-seqs "$MAX_NUM_SEQS"
              --max-num-batched-tokens "$MAX_NUM_BATCHED_TOKENS"
              "$@"
          ports:
            - name: http
              containerPort: 8000
          # memory is close to the GPU node's whole allocatable total (~47Gi), so
          # only one engine pod can ever be scheduled regardless of how many GPUs
          # are free. That is deliberate: two engines on one node would share
          # PCIe, host memory bandwidth and the weights volume, and neither one's
          # latency numbers would be comparable to anything else in the store.
          resources:
            requests:
              nvidia.com/gpu: __GPU_COUNT__
              cpu: "8"
              memory: 22Gi
            limits:
              nvidia.com/gpu: __GPU_COUNT__
              cpu: "8"
              memory: 40Gi
          volumeMounts:
            - name: model-cache
              mountPath: __MODEL_MOUNT__
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: __MODEL_CACHE_PVC__
        # Ranks of a multi-GPU engine pass tensors through shared memory, so this
        # is a hard floor for anything above TENSOR_PARALLEL_SIZE 1, not a tuning
        # detail: too small shows up as a NCCL or bus error during startup.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE__
  namespace: __NAMESPACE__
  labels:
    app: __APP_LABEL__
spec:
  type: ClusterIP
  selector:
    app: __APP_LABEL__
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
