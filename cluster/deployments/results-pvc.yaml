# =============================================================================
# This repo's OWN results volume.
#
# Benchmark output (GuideLLM JSON/HTML) used to be written to the shared
# `guidellm-results-pvc`, which other benchmarking work (SGLang tuning, MTP,
# ngram, etc.) also writes to. That 5Gi shared volume filled up from
# accumulated results across *all* consumers and started silently breaking
# this repo's sweep (jobs would run the full load test, then crash with
# "No space left on device" trying to save the report).
#
# This PVC is dedicated to this repo's benchmark Jobs, so cleaning it up (or it
# filling up) never touches or interrupts anyone else's data on the shared
# volume. `bench clean results` wipes it; always `bench pull` first.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: __RESULTS_PVC__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/component: benchmark
    app.kubernetes.io/part-of: inference-optimization-bench
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
