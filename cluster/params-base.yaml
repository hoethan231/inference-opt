# =============================================================================
# Engine defaults: the lowest-precedence layer of every rendered ConfigMap.
#
# Precedence, lowest to highest:
#   this file  <  models/<model>.yaml  <  experiments/<exp>.yaml `params`
#              <  the sweep/grid axis value for the run
#
# Keys land in the `vllm-params` ConfigMap verbatim; the Deployment turns the
# ones it knows about into vLLM flags and appends EXTRA_ARGS as-is. Any knob
# without its own key goes in `extra_args` (here, in the model, or in the
# experiment) — no Deployment edit needed.
# =============================================================================

params:
  PORT: "8000"

  HF_HOME: /models/huggingface
  HF_XET_HIGH_PERFORMANCE: "1"

  TENSOR_PARALLEL_SIZE: "1"
  PIPELINE_PARALLEL_SIZE: "1"
  DATA_PARALLEL_SIZE: "1"
  EXPERT_PARALLEL: "0"

  # Hyperparameters. Models and experiments override these freely.
  GPU_MEMORY_UTILIZATION: "0.9"
  MAX_MODEL_LEN: "131072"
  KV_CACHE_DTYPE: "fp8"
  MAX_NUM_SEQS: "256"
  MAX_NUM_BATCHED_TOKENS: "2048"
  VLLM_ATTENTION_BACKEND: ""

extra_args: []
