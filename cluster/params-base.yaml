# =============================================================================
# Engine defaults: the lowest-precedence layer of every rendered ConfigMap.
#
# Precedence, lowest to highest:
#   this file  <  models/<model>.yaml  <  experiments/<exp>.yaml `params`
#              <  the sweep/grid axis value for the run
#
# Keys land in the `vllm-params` ConfigMap verbatim; the Deployment turns the
# ones it knows about into vLLM flags and appends EXTRA_ARGS as-is. Any knob
# without its own key goes in `extra_args` (here, in the model, or in the
# experiment) — no Deployment edit needed.
# =============================================================================

params:
  PORT: "8000"

  # HF cache lives on the model PVC so weights survive pod restarts.
  HF_HOME: /models/huggingface
  HF_HUB_ENABLE_HF_TRANSFER: "1"

  # Parallelism. TENSOR x PIPELINE x DATA is how many GPUs the engine pod
  # requests, so these four keys decide the shape of the deployment and not just
  # a flag: see benchlab/parallelism.py. Defaults are the single-GPU engine every
  # run before July 2026 used, so an experiment that says nothing still measures
  # what the older ones measured.
  TENSOR_PARALLEL_SIZE: "1"
  PIPELINE_PARALLEL_SIZE: "1"
  DATA_PARALLEL_SIZE: "1"
  # MoE only, and only with more than one rank: spreads experts rather than
  # sharding every tensor. 1 appends --enable-expert-parallel.
  EXPERT_PARALLEL: "0"

  # Hyperparameters. Models and experiments override these freely.
  GPU_MEMORY_UTILIZATION: "0.9"
  MAX_MODEL_LEN: "131072"
  KV_CACHE_DTYPE: "fp8"
  MAX_NUM_SEQS: "128"
  MAX_NUM_BATCHED_TOKENS: "2048"
  BLOCK_SIZE: "16"
  VLLM_ATTENTION_BACKEND: "" # empty = let vLLM auto-select

extra_args: []
