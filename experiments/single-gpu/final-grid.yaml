name: final-sweep
description: OFAT sweep of scheduler, memory and attention knobs.
model: nemotron-3-super-120b
workloads: [rate, concurrent]

strategy:
  kind: grid
  axes:
    - key: MAX_NUM_SEQS
      note: max concurrent running sequences — the scheduler's bouncer
      values: ["64", "128"]

    - key: MAX_NUM_BATCHED_TOKENS
      note: prefill chunk size — the scheduler's chewer
      values: ["1024", "2048", "4096", "8192"]