name: tp-2-grid-search
description: Grid search of MAX_NUM_SEQS and MAX_NUM_BATCHED_TOKENS for tensor-parallel over both GPUs.
model: nemotron-3-super-120b
workloads: [rate, concurrent]

params:
  TENSOR_PARALLEL_SIZE: "2"

strategy:
  kind: grid
  axes:
    - key: MAX_NUM_SEQS
      values: ["64", "128", "256"]
    - key: MAX_NUM_BATCHED_TOKENS
      values: ["2048", "4096"]
