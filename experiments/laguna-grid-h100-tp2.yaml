# Laguna scheduler grid on H100 TP2.
#
# H100-specific TP and FlashInfer allreduce backend are set here so the shared
# model config remains cluster-agnostic.
#
#   ./bench run laguna-grid-h100-tp2

name: laguna-grid-h100-tp2
description: Scheduler grid for Laguna S 2.1 on H100 TP2.
bucket: h100-tp2
model: laguna-s-2.1-fp8
workloads: [rate, concurrent]
params:
  TENSOR_PARALLEL_SIZE: "2"
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm

strategy:
  kind: grid
  axes:
    - key: MAX_NUM_SEQS
      values: ["64", "128", "256"]
    - key: MAX_NUM_BATCHED_TOKENS
      values: ["2048", "4096"]
